name: Build Docs(Pandoc)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-fonts-recommended fonts-firacode fonts-noto-core fonts-noto-extra fonts-noto-color-emoji fonts-noto-mono fonts-noto-cjk fonts-noto-cjk-extra
          tlmgr update --all
          tlmgr install amsfonts amsmath lm unicode-math iftex listings fancyvrb longtable booktabs multirow graphicx bookmark xcolor soul  geometry setspace babel xecjk framed fontspec bidi mathspec upquote microtype csquotes natbib biblatex bibtex biber upquote parskip xurl footnotehyper footnote

      - name: Build Documentation
        run: |
          pandoc --defaults ./scripts/pandoc-opts.yml

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: pdf/*
