name: Build Docs(Pandoc)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils grep curl gzip tar perl fonts-firacode fonts-noto-core fonts-noto-extra fonts-noto-color-emoji fonts-noto-mono fonts-noto-cjk fonts-noto-cjk-extra
          case $(uname -m) in
            "x86_64")
              curl -L 'https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-amd64.deb' > pandoc.deb
            ;;
            "arm64")
              curl -L 'https://github.com/jgm/pandoc/releases/download/3.7.0.2/pandoc-3.7.0.2-1-arm64.deb' > pandoc.deb
            ;;
            *)
              echo "::error::unsupported architecture $(uname -m)"
              exit 1
            ;;
          esac
          sudo apt install ./pandoc.deb
      - name: Build documentent
        run: |
          echo '::group::Install TeX Live'
          pushd /tmp
          curl -L -o install-tl-unx.tar.gz https://mirror.ctan.org/systems/texlive/tlnet/install-tl-unx.tar.gz
          zcat < install-tl-unx.tar.gz | tar xf -
          rm install-tl-unx.tar.gz
          cd install-tl-2*
          sudo perl ./install-tl --no-interaction --scheme=basic
          install_dir=$(ls -d /tmp/install-tl-* 2>/dev/null | sort -V | tail -n 1)
          echo "::debug::Install dir: \"$install_dir\""
          year=$(basename "$install_dir" | grep -oP 'install-tl-\K\d{4}')
          echo "::debug::Year: \"$year\""
          platform=$(uname -m)-$(uname -s | tr '[:upper:]' '[:lower:]') 
          echo "::debug::Platform: \"$platform\""
          case $platform in
            "x86_64-linux")
              platform="x86_64-linux"
            ;;
            "i686-linux")
              platform="i386-linux"
            ;;
            "x86_64-darwin")
              platform="universal-darwin"
            ;;
            "arm64-darwin")
              platform="arm64-darwin"
            ;;
            *)
              exit 2
            ;;
          esac
          echo "::debug::Platform: \"$platform\""
          export PATH="/usr/local/texlive/$year/bin/$platform:$PATH"
          popd
          echo '::endgroup::'
          echo '::group::Install TeX Packages'
          tlmgr init-usertree
          sudo $(which tlmgr) update --all || echo ''
          sudo $(which tlmgr) install pdfcol etoolbox environ tools pgf tikzfill tcolorbox xetex amsfonts amsmath lm unicode-math iftex listings fancyvrb tools booktabs multirow graphics bookmark xcolor soul  geometry setspace babel xecjk framed fontspec bidi mathspec upquote microtype csquotes natbib biblatex bibtex biber upquote parskip xurl footnotehyper mdwtools
          echo '::endgroup::'
          echo '::group::Run pandoc'
          pandoc --defaults ./scripts/pandoc-opts.yml
          echo '::endgroup::'

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: pdf/*
